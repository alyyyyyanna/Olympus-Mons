<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover and track mountain peaks with Peak Hunter.">
  <title>Peaks 1 | Peak Hunter</title>

  <!--
    Default look for this page. Every rule below uses :where(), which gives it
    ZERO specificity, so ANY rule in your own style.css overrides it
    (as long as your selector matches, e.g. ".ph-card { border-color: red; }").
    All class names start with "ph-" so they won't clash with other pages.
  -->
  <style>
    /* Fit-to-screen layout: header + title + 2 rows of cards + pager = exactly one screen. */
    :where(body.ph-peaks-page) {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      min-width: 320px;
      color: #111;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    :where(.ph-peaks-page *, .ph-peaks-page *::before, .ph-peaks-page *::after) {
      box-sizing: border-box;
    }

    /* Header + nav (top right) */
    :where(.ph-peaks-page .ph-header) {
      flex: none;
      display: flex;
      justify-content: flex-end;
      padding: 8px 14px 0;
    }
    :where(.ph-peaks-page .ph-nav) {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    :where(.ph-peaks-page .ph-nav a) {
      min-width: 82px;
      padding: 2px 10px;
      border: 1px solid #333;
      color: inherit;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
      text-transform: lowercase;
    }
    :where(.ph-peaks-page .ph-nav a:hover, .ph-peaks-page .ph-nav a:focus-visible) {
      background: #eee;
    }

    /* main fills whatever height is left under the header */
    :where(.ph-peaks-page main) {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    :where(.ph-peaks-page .ph-title) {
      flex: none;
      margin: 0 0 clamp(6px, 1.5vh, 16px);
      font-size: clamp(18px, 3.5vh, 26px);
      font-weight: 400;
      text-align: center;
      text-transform: uppercase;
    }

    /* 4 columns x 2 rows; the rows share the leftover height equally */
    :where(.ph-peaks-page .ph-grid) {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: clamp(10px, 2.5vh, 28px) clamp(10px, 2vw, 32px);
      width: 100%;
      max-width: 1100px;
      min-height: 0;
      margin: 0 auto;
      padding: 0 24px clamp(6px, 1.5vh, 14px);
    }
    :where(.ph-peaks-page .ph-card) {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border: 1px solid #333;
      background: #fff;
    }
    /* the picture stretches to fill the card above the name */
    :where(.ph-peaks-page .ph-image-link) {
      display: block;
      flex: 1 1 0;
      min-height: 0;
      margin: clamp(6px, 1.2vh, 10px) clamp(6px, 1.2vh, 10px) 0;
      line-height: 0;
    }
    :where(.ph-peaks-page .ph-image-link:hover, .ph-peaks-page .ph-image-link:focus-visible) {
      opacity: 0.85;
    }
    :where(.ph-peaks-page .ph-art) {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    :where(.ph-peaks-page .ph-image-link img) {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    :where(.ph-peaks-page .ph-name) {
      flex: none;
      min-height: 2.4em;
      margin: 0;
      padding: 4px 44px clamp(4px, 1vh, 10px);
      font-size: clamp(12px, 2.5vh, 20px);
      font-weight: 400;
      line-height: 1.2;
      text-align: center;
    }
    :where(.ph-peaks-page .ph-info) {
      position: absolute;
      right: 6px;
      bottom: 6px;
      display: grid;
      width: clamp(22px, 4vh, 30px);
      height: clamp(22px, 4vh, 30px);
      place-items: center;
      border: 3px solid currentColor;
      border-radius: 50%;
      color: inherit;
      font-size: clamp(13px, 2.6vh, 20px);
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
    }
    :where(.ph-peaks-page .ph-info:hover, .ph-peaks-page .ph-info:focus-visible) {
      background: #eee;
    }

    /* Page switcher (optional: delete the <nav class="ph-pager"> block if unwanted) */
    :where(.ph-peaks-page .ph-pager) {
      flex: none;
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 0 24px clamp(6px, 1.5vh, 14px);
      font-size: 14px;
    }
    :where(.ph-peaks-page .ph-pager a) {
      padding: 1px 14px;
      border: 1px solid #333;
      color: inherit;
      text-decoration: none;
    }

    /* Narrow / portrait screens: 2 columns x 4 rows, still one screen */
    @media (max-width: 700px) {
      :where(.ph-peaks-page .ph-header) { justify-content: center; }
      :where(.ph-peaks-page .ph-grid) {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(4, minmax(0, 1fr));
        padding-left: 12px;
        padding-right: 12px;
      }
      :where(.ph-peaks-page .ph-name) { padding-left: 36px; padding-right: 36px; }
    }
  </style>

  <!-- Your own stylesheet goes AFTER the block above so it can override it -->
  <link rel="stylesheet" href="style.css">
</head>

    <script>
      // Load each card's image path from the existing peaks JSON data.
      (async () => {
        const jsonPaths = ["peaks.json", "data/peaks.json", "data.json", "images.json"];
        let data;

        for (const path of jsonPaths) {
          try {
            const response = await fetch(path);
            if (response.ok) {
              data = await response.json();
              break;
            }
          } catch (_) {
            // Try the next common JSON location.
          }
        }
        if (!data) return;

        const normalize = value => String(value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
        const imageFields = ["image", "imageurl", "image_url", "img", "photo", "photourl", "picture", "src"];
        const nameFields = ["name", "title", "peak", "mountain", "peakname", "peak_name"];
        const records = [];

        const collect = (value, key = "") => {
          if (Array.isArray(value)) {
            value.forEach(item => collect(item));
          } else if (value && typeof value === "object") {
            records.push({ value, key });
            Object.entries(value).forEach(([childKey, child]) => collect(child, childKey));
          } else if (typeof value === "string" && /\.(avif|gif|jpe?g|png|svg|webp)(\?.*)?$/i.test(value)) {
            records.push({ value: { image: value }, key });
          }
        };
        collect(data);

        document.querySelectorAll(".ph-card").forEach(card => {
          const title = card.querySelector(".ph-name")?.textContent.trim();
          const target = normalize(title);
          const match = records.find(({ value, key }) => {
            const names = nameFields.map(field => value[field]).filter(Boolean);
            if (key) names.push(key);
            return names.some(name => normalize(name) === target);
          });
          if (!match) return;

          const image = imageFields.map(field => match.value[field]).find(Boolean);
          const imagePath = Array.isArray(image) ? image[0] : image;
          if (typeof imagePath !== "string") return;

          const link = card.querySelector(".ph-image-link");
          const img = document.createElement("img");
          img.src = imagePath;
          img.alt = `${title} photo`;
          link.replaceChildren(img);
        });
      })();
    </script>
